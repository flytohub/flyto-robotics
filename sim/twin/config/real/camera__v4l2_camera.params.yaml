# Parameters dumped from flyto-robot.local with `ros2 param dump /camera/v4l2_camera`
# on 2026-10-02. The twin's emulator node loads them unchanged.
# The robot names its image_transport parameters with a leading '.', which
# `ros2 param dump` writes under an empty key that the params-file parser
# rejects. They are merged one level up here; values are unchanged.
/camera/v4l2_camera:
  ros__parameters:
    auto_exposure: 0
    backlight_compensation: 0
    brightness: 5
    camera_frame_id: camera
    camera_info_url: ''
    contrast: 10
    exposure_time_absolute: 78
    focus_absolute: 512
    gain: 0
    gamma: 1
    image_raw:
      compressed:
        format: jpeg
        jpeg_quality: 95
        png_level: 3
        tiff:
          res_unit: inch
          xdpi: -1
          ydpi: -1
      compressedDepth:
        depth_max: 10.0
        depth_quantization: 100.0
        format: png
        png_level: 3
      depth_max: 10.0
      depth_quantization: 100.0
      enable_pub_plugins:
      - image_transport/compressedDepth
      - image_transport/compressed
      - image_transport/raw
      - image_transport/theora
      - image_transport/zstd
      format: jpeg
      jpeg_quality: 95
      keyframe_frequency: 64
      optimize_for: true
      png_level: 3
      quality: 31
      target_bitrate: 800000
      theora:
        keyframe_frequency: 64
        optimize_for: true
        quality: 31
        target_bitrate: 800000
      tiff:
        res_unit: inch
        xdpi: -1
        ydpi: -1
      zstd:
        zstd_level: 3
    image_size:
    - 640
    - 480
    output_encoding: yuv422_yuy2
    pixel_format: YUYV
    power_line_frequency: 1
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    saturation: 10
    sharpness: 0
    start_type_description_service: true
    use_sim_time: false
    video_device: /dev/v4l/by-id/usb-XC-TECH_Web_Camera_20251103.1921-video-index0
    white_balance_automatic: true
    white_balance_temperature: 4
