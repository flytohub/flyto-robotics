# Enterprise / offline deployment: hand the device credential to the runner in
# memory instead of leaving it on disk.
#
# Install this as a drop-in, not as a second copy of the unit:
#
#   /etc/systemd/system/flyto-job-runner.service.d/enterprise-credential.conf
#
# A drop-in overlays the shipped unit, so every later change to the base unit
# reaches this deployment too. A forked copy would not, and this repository has
# already paid for a second copy that drifted: the robot ran a stale runner
# after every deploy and it cost a live mission.
#
# Provision the credential first with scripts/provision-device-credential.sh,
# which wraps `systemd-creds encrypt` and verifies the round trip.
#
# What this buys, precisely:
#
#   With a TPM     the ciphertext at rest is sealed to that machine's TPM.
#                  A copied disk decrypts to nothing on any other host.
#   Without one    systemd falls back to a host key in /var/lib/systemd, which
#                  is root-only. Better than a file the service user can read,
#                  but still on the same disk — so it is not protection against
#                  someone holding the drive. Say so rather than implying more.
#
# Either way the plaintext exists only in $CREDENTIALS_DIRECTORY, a private
# tmpfs mounted for this service alone, and the runner writes nothing.

[Service]
LoadCredentialEncrypted=flyto-device:/etc/flyto/device.cred

# The runner prefers $CREDENTIALS_DIRECTORY when it is present, so there should
# be no on-disk credential to fall back to. Point the data directory somewhere
# it can still keep non-secret state, and leave the file absent.
Environment=FLYTO_RUNNER_DATA_DIR=/var/lib/flyto-runner

# An offline installation talks to an on-premises endpoint, never api.flyto2.com.
# Set it in the environment file rather than here so one drop-in serves every
# site:  FLYTO_CLOUD_URL=https://flyto.internal.example
