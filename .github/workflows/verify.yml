name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts-and-controller:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verification tools
        run: |
          python -m pip --isolated install -r requirements-dev.txt
          python -m pip --isolated install \
            git+https://github.com/flytohub/flyto-indexer.git@b7f424b3843baaf768931891a3a7fa42a8dc768e
          python -m pip --isolated install --no-build-isolation --no-deps --editable .
      - name: Verify contracts, assets, and closed loop
        run: make verify
      - name: Build Python distribution
        run: python -m build
      - name: Verify repository policy
        run: flyto-index verify . --full-scan --strict
